# dnsmasq lab configuration
#
# Queries arrive on :53. Dynamic A/AAAA records live in /data/dynamic.hosts
# (reloaded on SIGHUP). TXT/CNAME/PTR lines live in /data/dynamic.conf (require a
# dnsmasq restart, which ddnsd triggers).

user=dnsmasq
keep-in-foreground
pid-file=/run/dnsmasq.pid

no-hosts
no-resolv
bind-interfaces
listen-address=0.0.0.0
port=53

# Answer ${DDNS_ZONE} and its reverse zone from local data only.
local=/${DDNS_ZONE}/
local=/${DDNS_REV_ZONE}/
domain=${DDNS_ZONE}

# Static bootstrap records (host-record synthesizes PTR).
host-record=ns1.${DDNS_ZONE},${DDNS_NS1_IP}
host-record=gateway.${DDNS_ZONE},${DDNS_GW_IP}
host-record=static.${DDNS_ZONE},${DDNS_STATIC_IP}

# Explicit reverse map for the lab subnet (PTR → name).
ptr-record=${DDNS_GW_PTR}.${DDNS_REV_ZONE},gateway.${DDNS_ZONE}
ptr-record=${DDNS_STATIC_PTR}.${DDNS_REV_ZONE},static.${DDNS_ZONE}
ptr-record=${DDNS_NS1_PTR}.${DDNS_REV_ZONE},ns1.${DDNS_ZONE}

# Dynamic A/AAAA from nsupdate (SIGHUP-reloadable; also drives reverse via hosts).
addn-hosts=/data/dynamic.hosts

# Dynamic TXT/CNAME/PTR from nsupdate (rewritten + dnsmasq restarted by ddnsd).
conf-file=/data/dynamic.conf

# Upstream resolvers for everything outside ${DDNS_ZONE}.
server=${UPSTREAM_DNS_1}
server=${UPSTREAM_DNS_2}

cache-size=500
log-queries
log-facility=-
