# dnsmasq lab configuration
#
# Queries arrive on :53. Dynamic A/AAAA records live in /data/dynamic.hosts
# (reloaded on SIGHUP). TXT/CNAME/PTR lines live in /data/dynamic.conf (require a
# dnsmasq restart, which ddnsd triggers).

user=root
keep-in-foreground
pid-file=/run/dnsmasq.pid

no-hosts
no-resolv
bind-interfaces
listen-address=0.0.0.0
port=53

# Answer example.com and its reverse zone from local data only.
local=/example.com/
local=/0.168.192.in-addr.arpa/
domain=example.com

# Static bootstrap records on 192.168.0.0/24 (host-record synthesizes PTR).
host-record=ns1.example.com,192.168.0.53
host-record=gateway.example.com,192.168.0.1
host-record=static.example.com,192.168.0.10

# Explicit reverse map for the lab subnet (PTR → name).
ptr-record=1.0.168.192.in-addr.arpa,gateway.example.com
ptr-record=10.0.168.192.in-addr.arpa,static.example.com
ptr-record=53.0.168.192.in-addr.arpa,ns1.example.com

# Dynamic A/AAAA from nsupdate (SIGHUP-reloadable; also drives reverse via hosts).
addn-hosts=/data/dynamic.hosts

# Dynamic TXT/CNAME/PTR from nsupdate (rewritten + dnsmasq restarted by ddnsd).
conf-file=/data/dynamic.conf

# Upstream resolvers for everything outside example.com / 192.168.0.0/24.
server=1.1.1.1
server=8.8.8.8

cache-size=500
log-queries
log-facility=-
